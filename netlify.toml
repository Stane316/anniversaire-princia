# Configuration de déploiement Netlify — PRINCIA — Chapter 18
# Documentation : Docs/03—TECHNICAL_ARCHITECTURE.md & Docs/04—IMPLEMENTATION_ROADMAP.md

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fallback SPA (React Router) :
# Toutes les routes applicatives (/enquete, /souvenirs, /birthday/*, /app/*)
# retombent sur /index.html avec un statut 200.
# force = false garantit que les fichiers statiques existants dans dist/
# (/assets/*, /icons/*, /souvenirs/*, /souvenirs-gallery/*, /og-share.png,
# /manifest.webmanifest, /sw.js, /favicon.svg, /robots.txt) sont servis
# directement sans être interceptés par le routeur SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# En-têtes de sécurité et de confidentialité globaux
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Point d'entrée HTML : jamais mis en cache durablement afin que les
# nouvelles versions du bundle et du service worker soient détectées.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service Worker et runtime Workbox : revalidation systématique obligatoire
# pour garantir la détection et l'activation rapides des mises à jour PWA.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

# Web App Manifest : revalidation pour propager tout changement d'icône ou de métadonnées
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# Bundles Vite hachés (JS, CSS, polices woff2) : cache long immuable
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icônes, favicon et image Open Graph : cache modéré avec revalidation
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/og-share.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    X-Robots-Tag = "all"
